
version: '3'
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    ports:
      - '8081:8080'
      - '50000:50000'
    privileged: true
    user: root
    restart: always
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  sonarqube:
    image: sonarqube:lts-community
    ports:
      - '9000:9000'
    restart: always

  mysql-dev:
    image: mysql:8.0
    container_name: mysql-dev
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: calculator_dev
    volumes:
      - mysql_dev_data:/var/lib/mysql
    restart: always

  mysql-uat:
    image: mysql:8.0
    container_name: mysql-uat
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: calculator_uat
    volumes:
      - mysql_uat_data:/var/lib/mysql
    restart: always

  mysql-prod:
    image: mysql:8.0
    container_name: mysql-prod
    ports:
      - '3308:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: calculator_prod
    volumes:
      - mysql_prod_data:/var/lib/mysql
    restart: always

volumes:
  jenkins_home:
    external: true
  mysql_dev_data:
  mysql_uat_data:
  mysql_prod_data:
