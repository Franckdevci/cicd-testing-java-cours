version: '3'
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    ports:
      - '8081:8080'
      - '50000:50000'
    privileged: true
    user: root
    restart: always
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  sonarqube:
    image: sonarqube:lts-community
    ports:
      - '9000:9000'
    restart: always

volumes:
  jenkins_home:
    external: true
